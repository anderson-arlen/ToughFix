name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.92.0', stable]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev dbus systemd
      - name: Prepare isolated runtime directory
        run: |
          install -d -m 700 "$RUNNER_TEMP/toughfix-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/toughfix-runtime" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests and Clippy without camera access
        run: dbus-run-session -- make check
      - name: Build locked release
        run: cargo build --release --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked
      - name: Check dependencies, including maintenance warnings
        run: cargo audit --deny warnings
